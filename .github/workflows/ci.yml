name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          source build/versions.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "prek=$PREK_VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true
      - name: Install pinned prek
        run: |
          python3 -m venv "$RUNNER_TEMP/prek-venv"
          "$RUNNER_TEMP/prek-venv/bin/pip" install "prek==${{ steps.versions.outputs.prek }}"
          echo "$RUNNER_TEMP/prek-venv/bin" >> "$GITHUB_PATH"
      - name: Run lint
        run: make lint
      - name: Run tests
        run: make test
      - name: Build host binaries
        run: make build

  containers:
    name: Linux Podman images
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build Linux binaries
        run: make build-linux
      - name: Build and smoke-test native image
        run: make smoke
      - name: Test service lifecycle
        run: make container-test
