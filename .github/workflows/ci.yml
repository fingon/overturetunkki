name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          source build/versions.env
          {
            echo "go=$GO_VERSION"
            echo "prek=$PREK_VERSION"
            echo "python=$(python3 --version)"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            build/tools/go.sum
      - name: Install pinned prek
        run: |
          python3 -m venv "$RUNNER_TEMP/prek-venv"
          "$RUNNER_TEMP/prek-venv/bin/pip" install "prek==${{ steps.versions.outputs.prek }}"
          echo "$RUNNER_TEMP/prek-venv/bin" >> "$GITHUB_PATH"
      - name: Cache prek environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/prek
          key: prek-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.python }}-${{ steps.versions.outputs.prek }}-${{ steps.versions.outputs.go }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Cache golangci-lint results
        uses: actions/cache@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/versions.env', '.pre-commit-config.yaml', '.golangci.yaml', '**/go.mod', '**/go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/versions.env', '.pre-commit-config.yaml', '.golangci.yaml', '**/go.mod', '**/go.sum') }}-
      - name: Run lint
        run: make lint
      - name: Run tests
        run: make test
      - name: Build host binaries
        run: make build

  containers:
    name: Linux Podman images
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            build/tools/go.sum
      - name: Prepare Podman Go cache directory
        run: |
          cache_directory="$RUNNER_TEMP/podman-go-cache"
          mkdir -p "$cache_directory"
          echo "GO_CACHE_VOLUME=$cache_directory" >> "$GITHUB_ENV"
      - name: Cache Podman Go dependencies and builds
        uses: actions/cache@v5
        with:
          path: ${{ env.GO_CACHE_VOLUME }}
          key: podman-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/versions.env', '**/go.mod', '**/go.sum') }}-${{ hashFiles('**/*.go', 'Makefile', '.ko.yaml', 'scripts/**', '**/kodata/**') }}
          restore-keys: |
            podman-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/versions.env', '**/go.mod', '**/go.sum') }}-
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build Linux binaries
        run: make build-linux
      - name: Build and smoke-test native image
        run: make smoke
      - name: Test service lifecycle
        run: make container-test

  publish-service-image:
    name: Build publishable service image (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, containers]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            build/tools/go.sum
      - name: Prepare Podman Go cache directory
        run: |
          cache_directory="$RUNNER_TEMP/podman-go-cache"
          mkdir -p "$cache_directory"
          echo "GO_CACHE_VOLUME=$cache_directory" >> "$GITHUB_ENV"
      - name: Cache Podman Go dependencies and builds
        uses: actions/cache@v5
        with:
          path: ${{ env.GO_CACHE_VOLUME }}
          key: podman-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/versions.env', '**/go.mod', '**/go.sum') }}-${{ hashFiles('**/*.go', 'Makefile', '.ko.yaml', 'scripts/**', '**/kodata/**') }}
          restore-keys: |
            podman-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/versions.env', '**/go.mod', '**/go.sum') }}-
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build service image archive
        env:
          SERVICE_IMAGE_REPO: ghcr.io/${{ github.repository }}/service
        run: >-
          make service-image
          TARGET_ARCH=${{ matrix.arch }}
          SERVICE_IMAGE_REPO="$SERVICE_IMAGE_REPO"
          SERVICE_IMAGE_TAG=latest
      - name: Upload service image archive
        uses: actions/upload-artifact@v4
        with:
          name: service-image-${{ matrix.arch }}
          path: bin/service.tar
          if-no-files-found: error
          retention-days: 1

  publish-service-image-manifest:
    name: Publish service image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-service-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Download service image archives
        uses: actions/download-artifact@v4
        with:
          pattern: service-image-*
          path: images
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" |
            podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish latest multi-platform image
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}/service
          LOCAL_IMAGE_REPO: localhost/overturetunkki-service
        run: |
          podman load --input images/service-image-amd64/service.tar
          podman tag "$IMAGE_REPO:latest" "$LOCAL_IMAGE_REPO:amd64"
          podman load --input images/service-image-arm64/service.tar
          podman tag "$IMAGE_REPO:latest" "$LOCAL_IMAGE_REPO:arm64"
          podman manifest create "$LOCAL_IMAGE_REPO:latest"
          podman manifest add "$LOCAL_IMAGE_REPO:latest" "containers-storage:$LOCAL_IMAGE_REPO:amd64"
          podman manifest add "$LOCAL_IMAGE_REPO:latest" "containers-storage:$LOCAL_IMAGE_REPO:arm64"
          podman manifest push --all \
            "$LOCAL_IMAGE_REPO:latest" "docker://$IMAGE_REPO:latest"
